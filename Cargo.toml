[package]
name = "rrr_proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
axum = { version = "0.8.9"}
axum-macros = "0.5.1"
axum-test = "21.1.0"
tower = { version = "0.5.3", features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { version = "0.7.1", features = [
    "add-extension",
    "auth",
    "compression-full",
    "limit",
    "trace",
] }
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
once_cell = "1.21.4"
const_env = "0.1.5"
tungstenite = { version = "0.30.0", features = ["native-tls"] }
native-tls = "0.2.18"
futures = "0.3.34"
env_logger = "0.11.11"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log", "fmt"]}
tracing = "0.1.44"
log = "0.4.35"
tracing-test = "0.2.6"
sysinfo = "0.40.1"
futures-channel = "0.3.34"
ws-mock = "0.6.0"
anyhow = "1.0.104"
http-body-util = "0.1.5"
uuid = {version = "1.29.0", features = ["v4"]}
metrics-exporter-prometheus = "0.18.3"
metrics = "0.24.6"
signal-hook-tokio = {version = "0.4.0", features = ["futures-v0_3"]}
signal-hook = "0.4.6"
rustc-hash = "2.1.3"
socket2 = { version = "0.6.5", features = ["all"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
openssl = { version = "0.10.82", features = ["vendored"] }


[profile.release]
debug = 0
